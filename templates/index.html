<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Relatórios</title>
    <script>
        window.API_BASE_URL = "{{ api_base_url }}";
    </script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/static/js/services/apiClient.js"></script>
    <script src="/static/js/services/auth.js"></script>
    <script src="/static/js/services/report.js"></script>
    <script>
        if (!ApiClient.getToken()) {
            window.location.href = "/login.html";
        }
    </script>
</head>
<body>
    <button onclick="Auth.logout()">Logout</button>

    <div>
        <button onclick="baixarRelatorio()">Baixar Relatório de Vendas</button>
        <button onclick="baixarRelatorioBot()">Baixar Relatório de Estoque Bot</button>
    </div>

    <script>
        async function baixarRelatorio() {
            try {
                await Report.download("/report/vendas", "relatorio_vendas.xlsx");
            } catch (erro) {
                console.error("Erro na requisição:", erro);
                alert("Erro de autorização. Faça login novamente.");
            }
        }

        async function baixarRelatorioBot() {
            try {
                await Report.download("/report/estoque_bot", "relatorio_estoque_bot.xlsx");
            } catch (erro) {
                console.error("Erro na requisição:", erro);
                alert("Erro de autorização. Faça login novamente.");
            }
        }
    </script>
</body>
</html>
